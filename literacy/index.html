<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>희윤이 문해력 탐험</title>
<meta name="description" content="근거를 찾고 정확하게 읽는 희윤이 12주 문해력 보드">
<style>
:root{--ink:#171717;--muted:#707070;--line:#deded9;--bg:#f6f6f3;--card:#fff;--pink:#f4dce4;--soft:#efefeb;--green:#e8f3e8;--yellow:#fff3ce;--blue:#e5eef9;--radius:24px;--shadow:0 10px 28px rgba(0,0,0,.055)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(244,220,228,.7),transparent 26%),linear-gradient(#fbfbfa,var(--bg));color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer;color:inherit}.app{max-width:900px;margin:auto;padding:18px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{display:flex;gap:11px;align-items:center}.penguin{width:48px;height:48px;background:#171717;color:#fff;border-radius:17px;display:grid;place-items:center;font-size:26px}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);margin-top:2px}.home{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:800;text-decoration:none;color:inherit;font-size:12px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow)}.hero{padding:25px;position:relative;overflow:hidden}.hero:after{content:"♡";position:absolute;right:25px;top:12px;font-size:68px;color:var(--pink);transform:rotate(12deg)}.eyebrow{display:inline-block;background:#171717;color:#fff;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:900}.hero h1{font-size:32px;margin:13px 0 6px;letter-spacing:-.05em;position:relative;z-index:1}.hero p{color:var(--muted);font-size:13px;line-height:1.6;margin:0;position:relative;z-index:1}.progress{margin-top:18px;display:flex;gap:10px;align-items:center}.bar{height:10px;background:#e9e9e5;border-radius:99px;overflow:hidden;flex:1}.bar span{display:block;height:100%;background:#171717}.progress b{font-size:12px;white-space:nowrap}.weeks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.week{border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px;text-align:left;min-height:118px}.week.active{border:2px solid #171717}.week.done{background:#f8f8f5}.week .num{font-size:10px;color:var(--muted);font-weight:900}.week .ico{font-size:22px;margin:7px 0}.week b{display:block;font-size:13px;line-height:1.35}.week small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.study{display:none}.study.show{display:block}.card{padding:24px;margin-top:13px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head h2{margin:0;font-size:25px;letter-spacing:-.04em}.skill{background:var(--pink);padding:7px 10px;border-radius:99px;font-size:11px;font-weight:900;white-space:nowrap}.intro{color:var(--muted);font-size:13px;line-height:1.65}.passage{margin-top:18px;background:#fafaf7;border:1px dashed #c9c9c3;border-radius:20px;padding:20px;font-size:16px;line-height:1.9}.passage p{margin:0 0 12px}.passage p:last-child{margin:0}.data-table{width:100%;border-collapse:collapse;margin-top:18px}.data-table th,.data-table td{border:1px solid var(--line);padding:11px;text-align:center}.data-table th{background:#f1f1ed}.qcard{border-top:1px dashed var(--line);padding-top:20px;margin-top:20px}.qnum{font-size:11px;font-weight:900;color:var(--muted)}.qcard h3{font-size:17px;line-height:1.55;margin:6px 0 13px}.options{display:grid;gap:8px}.option{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 14px;text-align:left;font-weight:750}.option.selected{background:#171717;color:#fff;border-color:#171717}.option.locked{opacity:.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-size:12px;font-weight:900}.btn.primary{background:#171717;color:#fff;border-color:#171717}.btn.pink{background:var(--pink);border-color:transparent}.feedback{display:none;margin-top:12px;border-radius:16px;padding:13px;font-size:12px;line-height:1.65}.feedback.show{display:block}.feedback.retry{background:var(--yellow)}.feedback.ok{background:var(--green)}.feedback.help{background:var(--blue)}.tip{background:#171717;color:#fff;border-radius:24px;padding:20px;margin-top:15px}.tip small{color:#bbb;font-weight:800}.tip b{display:block;margin-top:7px;line-height:1.55}.finish{margin-top:15px;text-align:center}.finish .btn{min-width:180px}.result{display:none;margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px}.result.show{display:block}.result h3{margin:0 0 12px}.legend{display:flex;gap:7px;flex-wrap:wrap;font-size:11px}.legend span{padding:7px 9px;border-radius:99px}.g{background:var(--green)}.y{background:var(--yellow)}.b{background:var(--blue)}.footer{text-align:center;color:#999;font-size:11px;line-height:1.7;margin-top:28px}.reset{margin-top:8px;border:0;background:none;color:#999;text-decoration:underline;font-size:10px}@media(max-width:650px){.weeks{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:27px}.hero,.card{padding:20px;border-radius:25px}.passage{font-size:15px;padding:17px}.week{min-height:108px}.home{padding:9px}}

.week button{display:block;width:100%;margin-top:9px;text-align:left}.week h3{font-size:14px}.option:disabled{cursor:default}.btn:disabled{opacity:.45;cursor:default}.btn[aria-pressed="true"],.evidence[aria-pressed="true"]{background:var(--pink);border:2px solid var(--ink)}.evidence{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;margin:10px 0;line-height:1.9}.evidence span{display:block;font-size:11px;font-weight:bold}.table-wrap{overflow-x:auto}.head{flex-wrap:wrap}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #a65074;outline-offset:3px}.parent-grid{line-height:1.9}.qcard{scroll-margin-top:20px}#storageNotice:not(:empty){background:var(--yellow);padding:12px}summary{cursor:pointer;font-weight:bold}.week .btn{font-size:11px}.brand{min-width:0}.home{flex-shrink:0}@media(max-width:420px){.brand b{font-size:16px}.penguin{width:36px;flex-shrink:0}.card{padding:15px}.weeks{gap:7px}.week{padding:10px}.skill{white-space:normal}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><div class="penguin">🐧</div><div><b>희윤이 학습도우미</b><small>문해력 · 정확하게 읽는 연습</small></div></div><a class="home" href="../">← 오늘 할 일</a></header>
  <section class="hero"><span class="eyebrow">12-WEEK READING MISSION</span><h1>📖 희윤이 문해력 탐험</h1><p>빨리 답하는 것보다 <strong>글에서 근거를 찾고 정확하게 읽는 힘</strong>을 길러요.<br>일주일에 두 번 · A 기술 배우기 / B 실전 적용 · 회당 10~15분</p><div class="progress"><div class="bar"><span id="bar"></span></div><b id="progressText"></b></div></section>
  <p id="currentLabel"></p><p id="storageNotice" role="alert"></p><details class="card" id="parent"><summary>부모용 학습 기록</summary><div id="parentStats"></div></details><div class="weeks" id="weeks"></div>
  <main class="study" id="study"></main>
  <footer class="footer">희윤이 문해력보드 V2.0 · 답보다 근거를 먼저 찾아요 ♡<br>기존 V1 기록은 그대로 보관됩니다.<br><button class="reset" id="reset">V2 학습 기록 초기화</button></footer>
</div>
<script src="./data-v2.js"></script>
<script src="./app.js"></script>
</body>
</html>
