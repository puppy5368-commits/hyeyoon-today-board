<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>희윤이 문해력 탐험</title>
<meta name="description" content="근거를 찾고 정확하게 읽는 희윤이 12주 문해력 보드">
<style>
:root{--ink:#171717;--muted:#707070;--line:#deded9;--bg:#f6f6f3;--card:#fff;--pink:#f4dce4;--soft:#efefeb;--green:#e8f3e8;--yellow:#fff3ce;--blue:#e5eef9;--radius:24px;--shadow:0 10px 28px rgba(0,0,0,.055)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(244,220,228,.7),transparent 26%),linear-gradient(#fbfbfa,var(--bg));color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer;color:inherit}.app{max-width:900px;margin:auto;padding:18px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.brand{display:flex;gap:11px;align-items:center}.penguin{width:48px;height:48px;background:#171717;color:#fff;border-radius:17px;display:grid;place-items:center;font-size:26px}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);margin-top:2px}.home{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:800;text-decoration:none;color:inherit;font-size:12px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow)}.hero{padding:25px;position:relative;overflow:hidden}.hero:after{content:"♡";position:absolute;right:25px;top:12px;font-size:68px;color:var(--pink);transform:rotate(12deg)}.eyebrow{display:inline-block;background:#171717;color:#fff;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:900}.hero h1{font-size:32px;margin:13px 0 6px;letter-spacing:-.05em;position:relative;z-index:1}.hero p{color:var(--muted);font-size:13px;line-height:1.6;margin:0;position:relative;z-index:1}.progress{margin-top:18px;display:flex;gap:10px;align-items:center}.bar{height:10px;background:#e9e9e5;border-radius:99px;overflow:hidden;flex:1}.bar span{display:block;height:100%;background:#171717}.progress b{font-size:12px;white-space:nowrap}.weeks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.week{border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px;text-align:left;min-height:118px}.week.active{border:2px solid #171717}.week.done{background:#f8f8f5}.week .num{font-size:10px;color:var(--muted);font-weight:900}.week .ico{font-size:22px;margin:7px 0}.week b{display:block;font-size:13px;line-height:1.35}.week small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.study{display:none}.study.show{display:block}.card{padding:24px;margin-top:13px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head h2{margin:0;font-size:25px;letter-spacing:-.04em}.skill{background:var(--pink);padding:7px 10px;border-radius:99px;font-size:11px;font-weight:900;white-space:nowrap}.intro{color:var(--muted);font-size:13px;line-height:1.65}.passage{margin-top:18px;background:#fafaf7;border:1px dashed #c9c9c3;border-radius:20px;padding:20px;font-size:16px;line-height:1.9}.passage p{margin:0 0 12px}.passage p:last-child{margin:0}.data-table{width:100%;border-collapse:collapse;margin-top:18px}.data-table th,.data-table td{border:1px solid var(--line);padding:11px;text-align:center}.data-table th{background:#f1f1ed}.qcard{border-top:1px dashed var(--line);padding-top:20px;margin-top:20px}.qnum{font-size:11px;font-weight:900;color:var(--muted)}.qcard h3{font-size:17px;line-height:1.55;margin:6px 0 13px}.options{display:grid;gap:8px}.option{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 14px;text-align:left;font-weight:750}.option.selected{background:#171717;color:#fff;border-color:#171717}.option.locked{opacity:.7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;font-size:12px;font-weight:900}.btn.primary{background:#171717;color:#fff;border-color:#171717}.btn.pink{background:var(--pink);border-color:transparent}.feedback{display:none;margin-top:12px;border-radius:16px;padding:13px;font-size:12px;line-height:1.65}.feedback.show{display:block}.feedback.retry{background:var(--yellow)}.feedback.ok{background:var(--green)}.feedback.help{background:var(--blue)}.tip{background:#171717;color:#fff;border-radius:24px;padding:20px;margin-top:15px}.tip small{color:#bbb;font-weight:800}.tip b{display:block;margin-top:7px;line-height:1.55}.finish{margin-top:15px;text-align:center}.finish .btn{min-width:180px}.result{display:none;margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px}.result.show{display:block}.result h3{margin:0 0 12px}.legend{display:flex;gap:7px;flex-wrap:wrap;font-size:11px}.legend span{padding:7px 9px;border-radius:99px}.g{background:var(--green)}.y{background:var(--yellow)}.b{background:var(--blue)}.footer{text-align:center;color:#999;font-size:11px;line-height:1.7;margin-top:28px}.reset{margin-top:8px;border:0;background:none;color:#999;text-decoration:underline;font-size:10px}@media(max-width:650px){.weeks{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:27px}.hero,.card{padding:20px;border-radius:25px}.passage{font-size:15px;padding:17px}.week{min-height:108px}.home{padding:9px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><div class="penguin">🐧</div><div><b>희윤이 학습도우미</b><small>문해력 · 정확하게 읽는 연습</small></div></div><a class="home" href="../">← 오늘 할 일</a></header>
  <section class="hero"><span class="eyebrow">12-WEEK READING MISSION</span><h1>📖 희윤이 문해력 탐험</h1><p>빨리 답하는 것보다 <strong>글에서 근거를 찾고 정확하게 읽는 힘</strong>을 길러요.<br>일주일에 한 번, 10~15분이면 충분해요.</p><div class="progress"><div class="bar"><span id="bar"></span></div><b id="progressText"></b></div></section>
  <div class="weeks" id="weeks"></div>
  <main class="study" id="study"></main>
  <footer class="footer">희윤이 문해력보드 V1.0 · 답보다 근거를 먼저 찾아요 ♡<br><button class="reset" id="reset">학습 기록 초기화</button></footer>
</div>
<script src="./data.js"></script>
<script>
(()=>{
const KEY='heeyoon-literacy-board:v1';
const weeks=window.LITERACY_WEEKS||[];
let state=load(); let current=pickCurrent();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{version:1,weeks:{}}}catch(e){return{version:1,weeks:{}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function ws(n){if(!state.weeks[n])state.weeks[n]={done:false,completedAt:null,questions:{}};return state.weeks[n]}
function qs(w,i){const s=ws(w);if(!s.questions[i])s.questions[i]={first:null,final:null,retried:false,helped:false,resolved:false};return s.questions[i]}
function pickCurrent(){const next=weeks.find(w=>!ws(w.week).done);return(next||weeks[weeks.length-1]||{week:1}).week}
function renderWeeks(){const el=document.getElementById('weeks');el.innerHTML=weeks.map(w=>`<button class="week ${w.week===current?'active':''} ${ws(w.week).done?'done':''}" data-w="${w.week}"><span class="num">WEEK ${w.week} ${ws(w.week).done?'· 완료 ✓':''}</span><div class="ico">${w.icon}</div><b>${w.title}</b><small>${w.skill}</small></button>`).join('');el.querySelectorAll('.week').forEach(b=>b.onclick=()=>{current=+b.dataset.w;render()})}
function renderProgress(){const done=weeks.filter(w=>ws(w.week).done).length;document.getElementById('bar').style.width=(done/weeks.length*100)+'%';document.getElementById('progressText').textContent=`${done} / ${weeks.length}주 완료`}
function render(){renderWeeks();renderProgress();const w=weeks.find(x=>x.week===current);const root=document.getElementById('study');if(!w)return;root.classList.add('show');let media='';if(w.passage)media=`<div class="passage">${w.passage.map((p,i)=>`<p><strong>${w.passage.length>1&&w.week===9?(i+1)+'문단 · ':''}</strong>${p}</p>`).join('')}</div>`;if(w.table)media=`<table class="data-table"><thead><tr>${w.table.headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${w.table.rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
root.innerHTML=`<section class="card"><div class="head"><div><div class="qnum">WEEK ${w.week}</div><h2>${w.icon} ${w.title}</h2></div><span class="skill">${w.skill}</span></div><p class="intro">${w.intro}</p>${media}<div id="questions">${w.questions.map((q,i)=>questionHTML(w,q,i)).join('')}</div></section><section class="tip"><small>⭐ 오늘의 읽기 기술</small><b>${w.tip}</b></section><div class="finish"><button class="btn primary" id="finishBtn">이번 주 학습 완료 ✓</button></div><div class="result" id="result"></div>`;
wire(w);showResult(w);root.scrollIntoView({behavior:'smooth',block:'start'})}
function questionHTML(w,q,i){const s=qs(w.week,i);return `<div class="qcard" data-q="${i}"><div class="qnum">MISSION ${i+1}</div><h3>${q.q}</h3><div class="options">${q.options.map((o,j)=>`<button class="option ${s.final===j?'selected':''}" data-o="${j}">${j+1}. ${o}</button>`).join('')}</div><div class="actions"><button class="btn primary check">답 확인하기</button><button class="btn pink hint">🔎 다시 읽기 힌트</button></div><div class="feedback ${s.resolved?'show '+(s.helped?'help':s.retried?'ok':'ok'):''}">${s.resolved?feedbackText(q,s):''}</div></div>`}
function feedbackText(q,s){if(s.helped)return`🔵 도움을 받고 이해했어요.<br><strong>근거:</strong> ${q.evidence}`;if(s.retried)return`🟡 다시 읽고 해결했어요!<br><strong>근거:</strong> ${q.evidence}`;return`🟢 혼자 바로 해결했어요!<br><strong>근거:</strong> ${q.evidence}`}
function wire(w){document.querySelectorAll('.qcard').forEach(card=>{const i=+card.dataset.q,s=qs(w.week,i),q=w.questions[i];card.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>{if(s.resolved)return;card.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');s.final=+btn.dataset.o;save()});card.querySelector('.hint').onclick=()=>{if(s.resolved)return;s.retried=true;save();const f=card.querySelector('.feedback');f.className='feedback show retry';f.innerHTML=`🔎 <strong>다시 읽어볼까요?</strong><br>${q.hint}`};card.querySelector('.check').onclick=()=>{if(s.resolved)return;if(s.final===null){toast('먼저 답을 하나 골라주세요.');return}if(s.first===null)s.first=s.final;if(s.final===q.answer){s.resolved=true;save();render()}else{if(s.retried){s.helped=true;s.resolved=true;save();render()}else{s.retried=true;save();const f=card.querySelector('.feedback');f.className='feedback show retry';f.innerHTML=`아직 괜찮아요. 정답부터 보지 말고 <strong>글에서 근거를 다시 찾아봐요.</strong><br>힌트: ${q.hint}`}}}});document.getElementById('finishBtn').onclick=()=>{const all=w.questions.every((q,i)=>qs(w.week,i).resolved);if(!all){toast('모든 미션을 이해한 뒤 완료할 수 있어요.');return}const s=ws(w.week);s.done=true;s.completedAt=new Date().toISOString();save();render();toast('이번 주 문해력 미션 완료! 🎉')}}
function showResult(w){const s=ws(w.week),el=document.getElementById('result');if(!s.done)return;const vals=w.questions.map((q,i)=>qs(w.week,i));const green=vals.filter(x=>x.resolved&&!x.retried&&!x.helped).length,yellow=vals.filter(x=>x.resolved&&x.retried&&!x.helped).length,blue=vals.filter(x=>x.helped).length;el.classList.add('show');el.innerHTML=`<h3>🎉 WEEK ${w.week} 완료!</h3><div class="legend"><span class="g">🟢 혼자 해결 ${green}</span><span class="y">🟡 다시 읽고 해결 ${yellow}</span><span class="b">🔵 도움받아 이해 ${blue}</span></div><p class="intro">점수보다 <strong>어떻게 이해했는지</strong>를 기록했어요. 다음 주에도 하나씩 해봐요.</p>`}
let tt;function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#171717;color:white;padding:11px 15px;border-radius:99px;font-size:12px;font-weight:800;z-index:99';document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}
document.getElementById('reset').onclick=()=>{if(confirm('문해력 12주 학습 기록을 모두 초기화할까요?')){localStorage.removeItem(KEY);state={version:1,weeks:{}};current=1;render()}};
render();
})();
</script>
</body>
</html>
